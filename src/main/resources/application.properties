spring.application.name=service-portal

# H2 file database (data survives restarts; stored in ./data)
spring.datasource.url=jdbc:h2:file:./data/fixit;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# H2 web console is off: it registers an extra servlet that makes Spring Security path rules ambiguous.
spring.h2.console.enabled=false

# Payment proof uploads (stored in the database)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Seeded admin account (created on startup if missing). CHANGE THE PASSWORD.
app.admin.email=admin@fixit.local
app.admin.password=Admin@12345
app.admin.name=Platform Admin

# Platform service charge (percent of the agreed price, deducted from the technician)
app.service-charge-percent=10

# Routing and address search provider: geoapify (default) or ors (OpenRouteService)
app.routing.provider=geoapify
# Geoapify (https://www.geoapify.com): set the GEOAPIFY_API_KEY environment variable, never paste the key here
app.geoapify.api-key=${GEOAPIFY_API_KEY:}
app.geoapify.base-url=https://api.geoapify.com
# OpenRouteService, only used when app.routing.provider=ors. Set ORS_API_KEY.
app.routing.ors.api-key=${ORS_API_KEY:}
app.routing.ors.base-url=https://api.openrouteservice.org
# Address search is limited to this country (ISO code); empty = worldwide
app.geocoding.country=LK

# Problem matching: groq (AI, free tier) or keyword. Groq falls back to keywords if the key is missing or a call fails.
# Never put the key in this file: set the GROQ_API_KEY environment variable.
app.matching.provider=groq
app.matching.groq.api-key=${GROQ_API_KEY:}
app.matching.groq.model=openai/gpt-oss-20b
app.matching.groq.base-url=https://api.groq.com/openai/v1
